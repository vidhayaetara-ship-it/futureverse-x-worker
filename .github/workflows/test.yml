name: FutureVerse X Video Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create vertical MP4
        run: |
          ffmpeg -f lavfi -i "color=c=0x101828:s=1080x1920:r=30:d=5" \
          -vf "drawtext=text='FutureVerse X':fontcolor=white:fontsize=100:x=(w-text_w)/2:y=(h-text_h)/2" \
          -c:v libx264 -pix_fmt yuv420p -t 5 \
          futureverse-test.mp4

      - name: Save test video
        uses: actions/upload-artifact@v4
        with:
          name: futureverse-test-video
          path: futureverse-test.mp4
