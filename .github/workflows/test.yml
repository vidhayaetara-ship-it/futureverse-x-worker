name: FutureVerse X Worker Test

on:
  workflow_dispatch:

jobs:
  test-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check worker
        run: |
          echo "FutureVerse X Worker is working!"
          ffmpeg -version
