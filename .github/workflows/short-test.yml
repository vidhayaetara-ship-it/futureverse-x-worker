name: FutureVerse X Cinematic Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install kokoro soundfile numpy pillow

      - name: Create voice and background
        run: |
          cat > create.py <<'PY'
          from kokoro import KPipeline
          from PIL import Image, ImageDraw, ImageFont
          import soundfile as sf
          import numpy as np
          import random

          script = (
              "Look up at the night sky. "
              "Every star you see is a distant sun. "
              "Some may have planets of their own. "
              "And somewhere out there, "
              "new discoveries are waiting."
          )

          pipeline = KPipeline(lang_code="b")
          parts = []

          for _, _, audio in pipeline(
              script,
              voice="bm_george",
              speed=0.9
          ):
              parts.append(np.asarray(audio))

          if not parts:
              raise RuntimeError("Voice generation failed")

          voice = np.concatenate(parts)
          sf.write("voice.wav", voice, 24000)

          duration = len(voice) / 24000
          print("Voice duration:", duration)

          # Create a cinematic star background
          random.seed(42)
          w, h = 720, 1280

          image = Image.new("RGB", (w, h))
          pixels = image.load()

          for y in range(h):
              for x in range(w):
                  pixels[x, y] = (
                      int(5 + 8 * y / h),
                      int(9 + 12 * y / h),
                      int(30 + 22 * y / h)
                  )

          draw = ImageDraw.Draw(image)

          for i in range(230):
              x = random.randint(0, w - 1)
              y = random.randint(0, h - 1)
              r = random.choice([1, 1, 1, 2, 3])
              shade = random.randint(110, 255)
              draw.ellipse(
                  (x-r, y-r, x+r, y+r),
                  fill=(shade, shade, 255)
              )

          draw.ellipse(
              (140, 300, 580, 740),
              outline=(50, 90, 180),
              width=3
          )

          draw.ellipse(
              (180, 340, 540, 700),
              fill=(20, 35, 85),
              outline=(100, 145, 220),
              width=4
          )

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          title_font = ImageFont.truetype(font_path, 49)
          small_font = ImageFont.truetype(font_path, 24)

          def centered(text, y, font, color):
              box = draw.textbbox((0, 0), text, font=font)
              width = box[2] - box[0]
              draw.text(
                  ((w-width)/2, y),
                  text,
                  fill=color,
                  font=font
              )

          centered("FUTUREVERSE X", 100, title_font, "white")
          centered("BEYOND THE KNOWN", 175, small_font, "#75caff")

          image.save("background.png")

          # Approximate sentence-level subtitle timing
          lines = [
              "Look up at the night sky.",
              "Every star you see is a distant sun.",
              "Some may have planets of their own.",
              "And somewhere out there,",
              "new discoveries are waiting."
          ]

          weights = [len(line.split()) for line in lines]
          total = sum(weights)
          current = 0

          def timestamp(t):
              hours = int(t // 3600)
              minutes = int(t // 60) % 60
              seconds = int(t) % 60
              millis = int((t % 1) * 1000)
              return f"{hours:02}:{minutes:02}:{seconds:02},{millis:03}"

          with open("subtitles.srt", "w") as file:
              for i, line in enumerate(lines):
                  start = current
                  current += duration * weights[i] / total
                  end = current

                  file.write(
                      f"{i+1}\n"
                      f"{timestamp(start)} --> {timestamp(end)}\n"
                      f"{line}\n\n"
                  )

          print("Assets created successfully")
          PY

          python create.py

      - name: Render cinematic MP4
        run: |
          ffmpeg -y \
            -loop 1 -framerate 30 -i background.png \
            -i voice.wav \
            -filter_complex "[0:v]scale=800:1422,zoompan=z='min(zoom+0.0003,1.10)':d=1:s=720x1280:fps=30,subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=19,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Alignment=2,MarginV=170'[v]" \
            -map "[v]" -map 1:a \
            -c:v libx264 -preset ultrafast \
            -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            -shortest \
            futureverse-cinematic.mp4

      - name: Save final video
        uses: actions/upload-artifact@v4
        with:
          name: futureverse-cinematic-short
          path: futureverse-cinematic.mp4
          if-no-files-found: error
